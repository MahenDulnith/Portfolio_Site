<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Project Breakdown Tracker — Track your projects, phases, and action steps with a beautiful, interactive dashboard.">
    <meta name="theme-color" content="#0a0e1a">
    <title>Project Breakdown Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- ========== HEADER ========== -->
        <header class="app-header">
            <div class="header-top">
                <div class="logo-section">
                    <h1 class="app-title">
                        <span class="logo-icon">◆</span>
                        ProjectFlow
                    </h1>
                    <p class="app-subtitle">Break it down. Get it done.</p>
                </div>
                
                <button type="button" class="btn-secondary" id="userProfileBtn" style="display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; height: fit-content; background: var(--bg-card);">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <span id="currentUserDisplay">User</span>
                </button>
            </div>
            <div class="progress-section">
                <div class="progress-info">
                    <span class="progress-label">Overall Progress</span>
                    <span id="progressPercent" class="progress-value">0%</span>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="overallProgress" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                </div>
                <div class="stats-row" id="statsRow">
                    <!-- Dynamically populated -->
                </div>
            </div>
        </header>

        <!-- ========== FILTERS ========== -->
        <div class="filter-toolbar">
            <div class="search-wrapper">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                <input type="text" id="searchInput" class="search-input" placeholder="Search tasks..." aria-label="Search tasks">
            </div>
            <div class="filter-group">
                <select id="filterProject" class="filter-select" aria-label="Filter by project">
                    <option value="">All Projects</option>
                </select>
                <select id="filterAssignee" class="filter-select" aria-label="Filter by assignee">
                    <option value="">All Assignees</option>
                </select>
                <select id="filterPriority" class="filter-select" aria-label="Filter by priority">
                    <option value="">All Priorities</option>
                    <option value="High">High</option>
                    <option value="Medium">Medium</option>
                    <option value="Low">Low</option>
                </select>
                <select id="filterStatus" class="filter-select" aria-label="Filter by status">
                    <option value="">All Statuses</option>
                    <option value="Pending">Pending</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Done">Done</option>
                </select>
            </div>
        </div>

        <!-- ========== MAIN BOARD ========== -->
        <main class="board" id="board" aria-label="Project board">
            <!-- Dynamically rendered by app.js -->
        </main>
    </div>

    <!-- ========== ADD/EDIT TASK MODAL ========== -->
    <div class="modal-overlay" id="taskModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Add New Task</h2>
                <button class="modal-close" id="modalClose" aria-label="Close modal">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <form id="taskForm" novalidate>
                    <div class="form-group">
                        <label class="form-label" for="taskProject">Project *</label>
                        <input type="text" id="taskProject" class="form-input" list="projectList" placeholder="e.g. Facebook Income" required>
                        <datalist id="projectList"></datalist>
                    </div>
                    <div class="form-group" id="taskActionGroup">
                        <label class="form-label">Task Name(s) *</label>
                        <div id="taskActionContainer" style="display: flex; flex-direction: column; gap: 8px;">
                            <!-- Inputs will be dynamically generated here -->
                        </div>
                        <div style="margin-top: 12px; display: flex; align-items: center;">
                            <button type="button" id="importTaskBtn" style="background: rgba(255,255,255,0.05); border: 1px dashed var(--border-color); color: var(--text-secondary); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 0.85rem; padding: 10px 12px; border-radius: var(--radius-sm); width: 100%; justify-content: center; transition: all var(--transition); user-select: none;">
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                    Import tasks from .txt
                                </div>
                                <span style="font-size: 0.7rem; opacity: 0.7;">(Tap to Import • Hold to Export current project)</span>
                            </button>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="taskAssignee">Assignee</label>
                            <select id="taskAssignee" class="form-select">
                                <option value="Mahen">Mahen</option>
                                <option value="Sahan">Sahan</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="taskPriority">Priority</label>
                            <select id="taskPriority" class="form-select">
                                <option value="High">High</option>
                                <option value="Medium">Medium</option>
                                <option value="Low">Low</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="taskStatus">Status</label>
                            <select id="taskStatus" class="form-select">
                                <option value="Pending">Pending</option>
                                <option value="In Progress">In Progress</option>
                                <option value="Done">Done</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="taskDueDate">Due Date</label>
                            <input type="date" id="taskDueDate" class="form-input">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="taskNotes">Notes</label>
                        <textarea id="taskNotes" class="form-textarea" rows="3" placeholder="Any additional details..."></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn-secondary" id="cancelBtn">Cancel</button>
                        <button type="submit" class="btn-primary">Save Task</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- ========== ADD NEW PROJECT MODAL ========== -->
    <div class="modal-overlay" id="projectModal" role="dialog" aria-modal="true" aria-labelledby="projectModalTitle">
        <div class="modal" style="max-width: 400px;">
            <div class="modal-header">
                <h2 class="modal-title" id="projectModalTitle">New Project</h2>
                <button class="modal-close" id="projectModalClose" aria-label="Close modal">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <form id="projectForm" novalidate>
                    <div class="form-group">
                        <label class="form-label" for="newProjectName">Project Name *</label>
                        <input type="text" id="newProjectName" class="form-input" placeholder="e.g. YouTube Channel" required>
                        <div style="margin-top: 12px; display: flex; align-items: center;">
                            <button type="button" id="importProjectBtn" style="background: rgba(255,255,255,0.05); border: 1px dashed var(--border-color); color: var(--text-secondary); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 0.85rem; padding: 10px 12px; border-radius: var(--radius-sm); width: 100%; justify-content: center; transition: all var(--transition); user-select: none;">
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                    Import tasks from .txt
                                </div>
                                <span style="font-size: 0.7rem; opacity: 0.7;">(Tap to Import • Hold for Template)</span>
                            </button>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn-secondary" id="projectCancelBtn">Cancel</button>
                        <button type="submit" class="btn-primary">Create Project</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- ========== EDIT PROJECT MODAL ========== -->
    <div class="modal-overlay" id="editProjectModal" role="dialog" aria-modal="true" aria-labelledby="editProjectModalTitle">
        <div class="modal">
            <div class="modal-header">
                <h2 id="editProjectModalTitle">Edit Project</h2>
                <button type="button" class="modal-close" id="editProjectModalClose" aria-label="Close modal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="editProjectForm">
                    <div class="form-group">
                        <label class="form-label" for="editProjectName">Project Name *</label>
                        <input type="text" id="editProjectName" class="form-input" placeholder="Project Name" required>
                    </div>
                    
                    <div class="form-actions" style="justify-content: space-between;">
                        <button type="button" class="btn-danger" id="editProjectDeleteBtn" style="background: transparent; border: 1px solid var(--danger-color); color: var(--danger-color);">Delete</button>
                        <div style="display: flex; gap: 12px;">
                            <button type="button" class="btn-secondary" id="editProjectCancelBtn">Cancel</button>
                            <button type="submit" class="btn-primary">Save Changes</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- ========== DELETE CONFIRMATION MODAL ========== -->
    <div class="modal-overlay" id="confirmModal" role="dialog" aria-modal="true" aria-labelledby="confirmModalTitle">
        <div class="modal" style="max-width: 400px; text-align: center;">
            <div class="modal-body" style="padding-top: 32px;">
                <h3 id="confirmModalTitle" style="margin-bottom: 12px; color: var(--text-primary); font-size: 1.2rem;">Delete Task?</h3>
                <p id="confirmModalText" style="margin-bottom: 24px; color: var(--text-secondary); line-height: 1.5;"></p>
                <div id="confirmProjectInputContainer" style="display: none; margin-bottom: 24px; text-align: left;">
                    <label class="form-label" style="font-size: 0.8rem;">Type <strong>yes</strong> to confirm deletion:</label>
                    <input type="text" id="confirmProjectInput" class="form-input" placeholder="yes" autocomplete="off">
                </div>
                <div class="form-actions" style="justify-content: center; gap: 16px;">
                    <button type="button" class="btn-secondary" id="confirmCancelBtn" style="width: auto; padding: 10px 24px;">Cancel</button>
                    <button type="button" class="btn-danger" id="confirmDeleteBtn" style="width: auto; padding: 10px 24px;">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== USER SELECTION MODAL ========== -->
    <div class="modal-overlay" id="userSelectModal" role="dialog" aria-modal="true" aria-labelledby="userSelectModalTitle">
        <div class="modal" style="max-width: 400px; text-align: center;">
            <div class="modal-header">
                <h2 id="userSelectModalTitle">Who is working?</h2>
            </div>
            <div class="modal-body">
                <p style="margin-bottom: 24px; color: var(--text-secondary);">Select your profile to continue.</p>
                <div style="display: flex; gap: 16px; justify-content: center;">
                    <button type="button" class="btn-primary user-select-btn" data-user="Mahen" style="flex: 1; padding: 16px; font-size: 1.1rem; background: var(--accent-primary);">Mahen</button>
                    <button type="button" class="btn-primary user-select-btn" data-user="Sahan" style="flex: 1; padding: 16px; font-size: 1.1rem; background: var(--status-progress);">Sahan</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== TOAST CONTAINER ========== -->
    <div class="toast-container" id="toastContainer" aria-live="polite"></div>

    <!-- Hidden file input for imports -->
    <input type="file" id="importFileInput" accept=".txt" style="display: none;">
    <input type="file" id="importTaskFileInput" accept=".txt" style="display: none;">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <script src="app.js"></script>
</body>
</html>
